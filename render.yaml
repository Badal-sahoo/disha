# Render blueprint. `render.yaml` at the repo root, "New > Blueprint" in Render.
#
# One web service. The database is Neon (external, free tier) and the channel
# layer is in-memory, which is correct for a SINGLE instance -- see REDIS_URL below.
services:
  - type: web
    name: disha-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: ./build.sh
    # daphne, not gunicorn: this app serves WebSockets on /ws/ops, and a WSGI
    # server cannot. $PORT is provided by Render.
    startCommand: daphne -b 0.0.0.0 -p $PORT config.asgi:application
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      # Paste the Neon pooled connection string here (Render dashboard, not git).
      - key: DATABASE_URL
        sync: false
      # Empty string = in-memory channel layer. Groups live in ONE process's
      # memory, so this is only correct while the service runs a single
      # instance. Scale past one and you need a real Redis here.
      - key: REDIS_URL
        value: ""
      - key: ALLOWED_HOSTS
        value: "disha-api.onrender.com"
      # Your Vercel origin(s). No trailing slash.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: USE_ROAD_GRAPH
        value: "True"
      - key: USE_WEBSOCKETS
        value: "True"
      - key: USE_ALERT_FIXTURE
        value: "True"
      - key: DISPATCH_HORIZON_MIN
        value: "120"
      # Set to "true" for ONE deploy to load the demo district, then unset it.
      - key: SEED_DEMO
        value: "false"
